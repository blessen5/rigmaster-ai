<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | RigMaster AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            background: radial-gradient(circle at center, #1a1b2e 0%, #0f1021 100%);
            margin: 0;
            padding: 2rem;
        }

        .maintenance-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4rem 2rem;
            border-radius: 24px;
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .admin-login {
            margin-top: 3rem;
            font-size: 0.9rem;
        }

        .admin-link {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="maintenance-card">
        <div class="icon">🛠️</div>
        <h1 class="text-gradient">Under Maintenance</h1>
        <p>RigMaster AI is currently undergoing scheduled maintenance to improve our hardware optimization algorithms.
        </p>
        <p>We'll be back shortly with even better performance insights!</p>

        <div class="admin-login">
            Are you an administrator? <a href="/login" class="admin-link">Log in here</a>
        </div>
    </div>
</body>

</html>
