<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RigMaster | Support Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bot-primary: #10b981;
            --bot-bg: #030712;
            --bot-glass: rgba(17, 24, 39, 0.8);
            --bot-border: rgba(16, 185, 129, 0.2);
            --bot-text: #f9fafb;
        }

        body {
            background-color: var(--bot-bg);
            color: var(--bot-text);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1000px;
            margin: 2rem auto;
            width: 95%;
            background: var(--bot-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--bot-border);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            padding: 1.5rem 2.5rem;
            background: rgba(16, 185, 129, 0.05);
            border-bottom: 1px solid var(--bot-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bot-identity {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .bot-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--bot-primary), #059669);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .bot-avatar svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .bot-info h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .bot-info span {
            font-size: 0.7rem;
            color: var(--bot-primary);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--bot-primary) transparent;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bot-primary);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 1.2rem 1.8rem;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 1rem;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .assistant-msg {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--bot-border);
            border-bottom-left-radius: 4px;
        }

        .user-msg {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--bot-primary), #059669);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.5);
        }

        .chat-footer {
            padding: 2rem 2.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid var(--bot-border);
        }

        .input-wrapper {
            display: flex;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.6rem;
            border-radius: 20px;
            border: 1px solid var(--bot-border);
            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--bot-primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem 1rem;
            color: white;
            outline: none;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
        }

        .send-btn {
            background: var(--bot-primary);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #0db17b;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        /* Markdown Styles */
        .assistant-msg h3 {
            color: var(--bot-primary);
            margin: 1rem 0 0.5rem;
        }

        .assistant-msg p {
            margin-bottom: 0.8rem;
        }

        .assistant-msg a {
            color: var(--bot-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .assistant-msg a:hover {
            text-decoration: underline;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--bot-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1.0);
            }
        }

        .back-link {
            color: var(--bot-text);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.6;
            transition: 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>

    <div class="chat-container">
        <header class="chat-header">
            <div class="bot-identity">
                <div class="bot-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                </div>
                <div class="bot-info">
                    <h2>RigMaster Support</h2>
                    <span>Rule-Based Expert System // v2.0</span>
                </div>
            </div>
            <a href="{{ url_for('support_page') }}" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Support
            </a>
        </header>

        <main class="chat-messages" id="messages">
            <div class="message assistant-msg">
                <p>Hello! I am the **RigMaster Support Bot**. I can help you with technical questions, site features,
                    shipping, and more.</p>
                <p>What can I assist you with today?</p>
            </div>
        </main>

        <footer class="chat-footer">
            <div class="input-wrapper">
                <input type="text" id="chat-input" placeholder="Type your question..." onkeypress="handleKey(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const messagesContainer = document.getElementById('messages');
        const input = document.getElementById('chat-input');

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendMessage('user', text);

            const typing = document.createElement('div');
            typing.className = 'message assistant-msg';
            typing.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            messagesContainer.appendChild(typing);
            messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch('/api/simple-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                messagesContainer.removeChild(typing);

                if (data.status === 'success') {
                    appendMessage('assistant', data.response);
                } else {
                    appendMessage('assistant', "I'm having trouble connecting to my knowledge base. Please try again later.");
                }
            } catch (err) {
                console.error(err);
                messagesContainer.removeChild(typing);
                appendMessage('assistant', "Network error. Please check your connection.");
            }
        }

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}-msg`;

            if (role === 'assistant') {
                msgDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(content) : content;
            } else {
                msgDiv.textContent = content;
            }

            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>

</html>
