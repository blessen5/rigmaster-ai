<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints | RigMaster AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        .support-hero {
            padding: 10rem 0 5rem;
            text-align: center;
        }

        .support-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 5rem;
        }

        .support-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .support-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .support-card h3 {
            margin-bottom: 1rem;
            color: var(--primary-light);
        }

        .support-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .contact-section {
            background: var(--bg-card);
            padding: 4rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            margin-bottom: 5rem;
        }

        .contact-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: var(--radius-sm);
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .resource-list {
            list-style: none;
        }

        .resource-list li {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resource-list li:last-child {
            border-bottom: none;
        }

        .resource-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .resource-link:hover {
            color: var(--primary-light);
        }

        .faq-item {
            margin-bottom: 1.5rem;
        }

        .faq-question {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .faq-answer {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .contact-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    {% include 'shared/navbar.html' %}


    <main class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div
            style="background: rgba(74, 222, 128, 0.1); border: 1px solid #4ade80; color: #4ade80; padding: 1rem; border-radius: 12px; margin-bottom: 2rem; text-align: center;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <section class="contact-section" id="contact" style="margin-top: 120px;">
            <h2 class="text-gradient" style="margin-bottom: 2.5rem; font-size: 2.5rem;">Submit a Complaint</h2>
            <form class="contact-form" action="{{ url_for('support_page') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="user_name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="user_email" placeholder="john@example.com" required>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Type of Request</label>
                    <select name="request_type" class="form-select" required>
                        <option value="complaint" selected>Formal Complaint</option>
                        <option value="support">Technical Support</option>
                        <option value="feedback">General Feedback</option>
                        <option value="bug">Report a Bug</option>
                        <option value="feature">Feature Request</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Message</label>
                    <textarea name="user_message" rows="5" placeholder="Tell us how we can help..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="grid-column: 1 / -1; font-size: 1.1rem; padding: 1rem;">Send Message</button>
            </form>
        </section>
    </main>


    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>

</html>
