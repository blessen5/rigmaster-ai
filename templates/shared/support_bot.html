<!-- RigMaster Support Bot Floating Widget -->
<div id="rigbot-root" class="rigbot-root">
    <div id="rigbot-launcher" class="rigbot-launcher" onclick="RigBot.toggle()" title="Support Chat">
        <div class="rigbot-glow"></div>
        <div class="rigbot-content">
            <svg viewBox="0 0 24 24" class="rigbot-icon" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
        </div>
        <div class="rigbot-label">Support Bot</div>
    </div>

    <div id="rigbot-panel" class="rigbot-panel">
        <div class="rigbot-glass"></div>
        <div class="rigbot-header">
            <div class="rigbot-id">
                <div class="rigbot-status"></div>
                <h3>RigMaster Support</h3>
            </div>
            <button class="rigbot-close" onclick="RigBot.close()">&times;</button>
        </div>

        <div id="rigbot-messages" class="rigbot-messages">
            <div class="rigbot-msg bot">
                <p>Hello! I am RigBot. How can I assist you with your PC build or technical questions?</p>
            </div>
        </div>

        <div class="rigbot-footer">
            <input type="text" id="rigbot-input" placeholder="Ask RigBot..." onkeypress="RigBot.handleKey(event)">
            <button onclick="RigBot.send()" class="rigbot-send">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                </svg>
            </button>
        </div>
    </div>
</div>

<style>
    .rigbot-root {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 20000;
        font-family: 'Outfit', sans-serif;
    }

    .rigbot-launcher {
        width: 60px;
        height: 60px;
        position: relative;
        cursor: pointer;
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .rigbot-content {
        width: 100%;
        height: 100%;
        background: #064e3b;
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #10b981;
        position: relative;
        z-index: 2;
        backdrop-filter: blur(10px);
    }

    .rigbot-glow {
        position: absolute;
        inset: -2px;
        background: #10b981;
        border-radius: 20px;
        filter: blur(8px);
        opacity: 0.4;
        z-index: 1;
        animation: rigbot-pulse 2s infinite alternate;
    }

    @keyframes rigbot-pulse {
        from {
            opacity: 0.2;
            transform: scale(0.95);
        }

        to {
            opacity: 0.5;
            transform: scale(1.05);
        }
    }

    .rigbot-icon {
        width: 30px;
        height: 30px;
    }

    .rigbot-label {
        position: absolute;
        right: 75px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(6, 78, 59, 0.9);
        padding: 6px 12px;
        border-radius: 8px;
        color: white;
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
    }

    .rigbot-launcher:hover .rigbot-label {
        opacity: 1;
        right: 80px;
    }

    .rigbot-launcher:hover {
        transform: scale(1.1);
    }

    .rigbot-panel {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px;
        height: 500px;
        background: #020617;
        border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        visibility: hidden;
        opacity: 0;
        transform: translateY(20px);
        transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .rigbot-panel.active {
        visibility: visible;
        opacity: 1;
        transform: translateY(0);
    }

    .rigbot-glass {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.1), transparent 40%);
        pointer-events: none;
    }

    .rigbot-header {
        padding: 1.2rem 1.5rem;
        background: rgba(16, 185, 129, 0.05);
        border-bottom: 1px solid rgba(16, 185, 129, 0.2);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 2;
    }

    .rigbot-id {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .rigbot-status {
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 8px #10b981;
    }

    .rigbot-header h3 {
        margin: 0;
        font-size: 0.95rem;
        color: white;
    }

    .rigbot-close {
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 1.5rem;
        cursor: pointer;
    }

    .rigbot-messages {
        flex: 1;
        padding: 1.2rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        position: relative;
        z-index: 2;
    }

    .rigbot-msg {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 15px;
        font-size: 0.9rem;
        line-height: 1.5;
    }

    .bot {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: #e2e8f0;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
    }

    .user {
        background: #10b981;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
    }

    .rigbot-footer {
        padding: 1rem;
        background: rgba(0, 0, 0, 0.2);
        border-top: 1px solid rgba(16, 185, 129, 0.2);
        display: flex;
        gap: 10px;
        position: relative;
        z-index: 2;
    }

    .rigbot-footer input {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 8px 12px;
        color: white;
        outline: none;
    }

    .rigbot-send {
        background: #10b981;
        border: none;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
</style>

<script>
    const RigBot = {
        isOpen: false,
        toggle() {
            this.isOpen = !this.isOpen;
            document.getElementById('rigbot-panel').classList.toggle('active', this.isOpen);
            if (this.isOpen) document.getElementById('rigbot-input').focus();
        },
        close() { this.isOpen = false; document.getElementById('rigbot-panel').classList.remove('active'); },
        handleKey(e) { if (e.key === 'Enter') this.send(); },
        async send() {
            const input = document.getElementById('rigbot-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            this.append('user', text);
            try {
                const res = await fetch('/api/simple-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                this.append('bot', data.response);
            } catch (e) { this.append('bot', "Connection error."); }
        },
        append(role, text) {
            const container = document.getElementById('rigbot-messages');
            const div = document.createElement('div');
            div.className = `rigbot-msg ${role}`;
            div.innerHTML = role === 'bot' ? marked.parse(text) : text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    };
</script>
