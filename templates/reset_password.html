<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RigMaster AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body style="overflow: hidden;">
    <div class="bg-grid"></div>
    <div
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10;">
        <div class="step-card" style="width: 100%; max-width: 450px; padding: 3rem; animation: slideUp 0.6s ease-out;">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <h1 class="text-gradient" style="font-size: 2rem; margin-bottom: 0.5rem;">Reset Password</h1>
                <p style="color: var(--text-muted);">Enter your new password below.</p>
            </div>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div
                style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); color: var(--primary-light); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem;">
                {{ messages[0] }}
            </div>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('reset_password') }}" method="POST" style="display: grid; gap: 1.5rem;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">New Password</label>
                    <input type="password" name="password" required placeholder="••••••••" class="form-select"
                        style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 1rem; border-radius: 12px;">
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Confirm
                        Password</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" class="form-select"
                        style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 1rem; border-radius: 12px;">
                </div>

                <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 1rem;">
                    Reset Password
                </button>
            </form>
        </div>
    </div>
</body>

</html>
