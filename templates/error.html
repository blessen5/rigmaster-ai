{% extends "base.html" %}

{% block title %}Application Error{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <div class="card bg-dark border-danger text-light shadow-lg">
        <div class="card-body text-center p-5">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
            <h2 class="mt-4 mb-3">Something Went Wrong</h2>
            <div class="alert alert-danger">
                {{ message | default('An unexpected error occurred.') }}
            </div>
            <p class="text-muted mt-4">
                Our team has been notified. Please try again later.
            </p>
            <div class="mt-4">
                <a href="{{ url_for('home') }}" class="btn btn-outline-light me-2">
                    <i class="bi bi-house me-2"></i>Return Home
                </a>
                <a href="javascript:history.back()" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-2"></i>Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
